name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck and build
              run: npm run build

            - name: Test
              run: npm test

            - name: Reproducible build
              run: npm run check:reproducible
